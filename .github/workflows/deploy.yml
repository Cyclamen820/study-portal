name: deploy-mkdocs

on:
  push:
    branches:
      - main  # mainブランチにプッシュされた時に作動します

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install mkdocs-material
      # ※他にもpip installしているプラグインがあればここに追記
      - run: mkdocs gh-deploy --force